name: Build Reson Web

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'youtube-browser/**'
      - 'haptic-lab/HapticLab/**'
      - '.github/workflows/build-youtube-browser.yml'
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode version and matching iOS test runtime
        type: choice
        default: '26.2'
        options: ['26.2', '16.4']

permissions:
  contents: read

concurrency:
  group: resonweb-${{ github.ref }}-${{ inputs.xcode || '26.2' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode || '26.2' }}.app/Contents/Developer
    defaults:
      run:
        working-directory: youtube-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build separate iPhone app and verify browser haptics
        run: bash scripts/build-and-test.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reson-Web-iPhone
          path: youtube-browser/.build/artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reson-Web-preview-and-tests
          path: |
            youtube-browser/.build/screenshots/
            youtube-browser/.build/build.log
            youtube-browser/.build/test.log
            youtube-browser/.build/test-summary.json
            youtube-browser/.build/diagnostics/
          retention-days: 7
