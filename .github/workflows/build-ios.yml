name: Build iPhone app

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'haptic-lab/**'
      - 'README.md'
      - 'llms.txt'
      - '.github/workflows/build-ios.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a new Release after tests pass (e.g. v2.7.0). Leave empty to build only.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hapticlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
    defaults:
      run:
        working-directory: haptic-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test audio analysis, public API and temporary-file cleanup
        run: |
          python -m pip install -r pc-server/requirements-dev.txt
          python -m unittest discover -s pc-server -p 'test_*.py' -v
      - name: Generate project and validate assets
        run: |
          node scripts/generate-project.mjs
          node scripts/generate-music-demo.mjs
          node scripts/generate-icons.mjs
          node scripts/validate-project.mjs
      - name: Build physical iPhone IPA without signing credentials
        run: bash scripts/build-ios.sh
      - name: Test patterns and app navigation on iPhone simulator
        run: bash scripts/test-ios.sh
      - name: Package IPA, install guides, PC server and API examples
        run: python scripts/package-release.py
      - name: Upload installable package for local signing
        uses: actions/upload-artifact@v4
        with:
          name: HapticLab-iPhone
          path: haptic-lab/.build/artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HapticLab-preview
          path: haptic-lab/.build/screenshots/
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HapticLab-test-results
          path: |
            haptic-lab/.build/TestResults.xcresult
            haptic-lab/.build/build-ios.log
            haptic-lab/.build/test-ios.log
            haptic-lab/.build/test-summary.json
            haptic-lab/.build/pc-test-metrics.json
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HapticLab-iPhone
          path: release
      - name: Validate release tag, source commit and file checksums
        working-directory: release
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("BUILD-INFO.json"))["version"])')
          SOURCE_COMMIT=$(python -c 'import json; print(json.load(open("BUILD-INFO.json"))["sourceCommit"])')
          test "$RELEASE_TAG" = "v$VERSION"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS.txt
      - name: Publish versioned installation files
        working-directory: release
        run: |
          printf '%s\n' \
            'ResonはYouTube動画（主に音楽）を振動付きで再生するiPhoneアプリです。' \
            '' \
            '初めての方はReson-install.zipを展開し、docs/INSTALL.mdを開いてください。' \
            'IPAは未署名です。Windows / MacのSideloadlyで自分のApple Accountを使って署名します。無料署名は7日ごとに更新が必要です。' \
            'iOS 16以降のCore Haptics対応iPhone向けです。実機の触感・動画との同期は利用端末で確認してください。' \
            '' \
            'PC解析・APIテストとiPhoneシミュレーターのテストが成功したビルドです。' \
            'ソースコミットとテスト結果はBUILD-INFO.json、ファイルの照合はSHA256SUMS.txtを参照してください。' > RELEASE-NOTES.md
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Reson ${RELEASE_TAG#v}" \
            --notes-file RELEASE-NOTES.md \
            HapticLab-unsigned.ipa Reson-install.zip BUILD-INFO.json TEST-SUMMARY.json SHA256SUMS.txt \
            INSTALL.md INSTALL-WINDOWS.md BUILD.md AI-INSTALL.md API.md PC-SERVER.md GOOGLE-LOGIN.md MUSIC.md
